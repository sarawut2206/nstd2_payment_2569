.search-label {

  margin-bottom: 10px;
  font-weight: 500;
  letter-spacing: 0.3px;
}

.search-wrap {

}
.search-wrap svg {

  top: 50%;

  color: #64748b;
  pointer-events: none;
}
#searchInput {
  width: 100%;

  background: #0f172a;
  border: 1.5px solid #334155;
  border-radius: 12px;
  font-family: inherit;
  font-size: 17px;
  color: #f1f5f9;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

#searchInput:focus {
  border-color: #c8a84b;
  box-shadow: 0 0 0 3px rgba(200,168,75,0.15);
}

/* ===== DROPDOWN ===== */
#dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0; right: 0;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  z-index: 100;
  display: none;
}
#dropdown.show { display: block; }

.drop-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  cursor: pointer;
  transition: background 0.12s;
  border-bottom: 1px solid #0f172a;
}
.drop-item:last-child { border-bottom: none; }
.drop-item:hover { background: #263247; }

.drop-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700;
  flex-shrink: 0;
}
.drop-avatar.male   { background: #1e3a5f; color: #7eb8f7; }
.drop-avatar.female { background: #4a1942; color: #f79ecf; }

.drop-info { flex: 1; min-width: 0; }
.drop-name {
  font-size: 15px;
  font-weight: 600;
  color: #f1f5f9;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.drop-id {
  font-size: 11px;
  color: #64748b;
  font-family: monospace;
  margin-top: 1px;
}

.drop-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 99px;
  flex-shrink: 0;
}
.drop-badge.cash     { background: #0d3325; color: #4ade80; }
.drop-badge.transfer { background: #0f2d4a; color: #60a5fa; }

.drop-no-result {
  padding: 24px;
  text-align: center;
  color: #475569;
  font-size: 14px;
}

/* ===== SELECTED CARD ===== */
#selectedCard {
  display: none;
  margin-top: 20px;
  background: #0f172a;
  border: 1.5px solid #334155;
  border-radius: 16px;
  padding: 20px;
  animation: slideUp 0.2s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
#selectedCard.visible { display: block; }

.sel-top {
  display: flex;
  align-items: center;
  gap: 14px;

  margin-bottom: 18px;
  font-size: 13px;
  color: #64748b;

.sel-dot.none     { background: #475569; }
.sel-dot.cash     { background: #4ade80; }
.sel-dot.transfer { background: #60a5fa; }

.pay-buttons {

  grid-template-columns: 1fr 1fr;
  gap: 10px;

  border-color: #166534;
  box-shadow: 0 0 0 3px rgba(74,222,128,0.12);

// บันทึก session ชั่วคราวไว้โชว์ badge (ไม่บังคับ login)
const sessionPay = {};

let currentStudent = null;
let toastTimer = null;

// ===== SEARCH =====
const input = document.getElementById('searchInput');
const dropdown = document.getElementById('dropdown');

input.addEventListener('input', () => {
  const q = input.value.trim();
  if (q.length < 1) { closeDropdown(); return; }
  const results = STUDENTS.filter(s =>
    s.name.includes(q) || s.id.includes(q)
  ).slice(0, 8);
  renderDropdown(results, q);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDropdown(); input.blur(); }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) closeDropdown();
});

function renderDropdown(results, q) {
  if (!results.length) {
    dropdown.innerHTML = '<div class="drop-no-result">ไม่พบชื่อ "' + q + '" ในรายชื่อ</div>';
    dropdown.classList.add('show');
    return;
  }
  dropdown.innerHTML = results.map(s => {
    const initials = s.name.charAt(0);
    const statusBadge = sessionPay[s.id]
      ? `<span class="drop-badge ${sessionPay[s.id]}">${sessionPay[s.id] === 'cash' ? '💵 เงินสด' : '🏦 โอนแล้ว'}</span>`
      : '';
    return `<div class="drop-item" onclick="selectStudent('${s.id}')">
      <div class="drop-avatar ${s.g}">${initials}</div>
      <div class="drop-info">
        <div class="drop-name">${s.name}</div>
        <div class="drop-id">${s.id}</div>
      </div>
      ${statusBadge}
    </div>`;
  }).join('');
  dropdown.classList.add('show');
}

function closeDropdown() {
  dropdown.classList.remove('show');
  dropdown.innerHTML = '';
}

// ===== SELECT STUDENT =====
function selectStudent(id) {
  currentStudent = STUDENTS.find(s => s.id === id);
  closeDropdown();
  input.value = currentStudent.name;

  const card = document.getElementById('selectedCard');
  const initials = currentStudent.name.charAt(0);

  document.getElementById('selAvatar').textContent = initials;
  document.getElementById('selAvatar').className = 'sel-avatar ' + currentStudent.g;
  document.getElementById('selName').textContent = currentStudent.name;
  document.getElementById('selId').textContent = 'เลขประจำตัว: ' + currentStudent.id;

  updateCardStatus();
  card.classList.add('visible');
}

function updateCardStatus() {
  if (!currentStudent) return;
  const st = sessionPay[currentStudent.id];
  const dot   = document.getElementById('selDot');
  const label = document.getElementById('selStatus');
  const btnC  = document.getElementById('btnCash');
  const btnT  = document.getElementById('btnTransfer');

  dot.className   = 'sel-dot ' + (st || 'none');
  label.textContent = st === 'cash' ? '✅ ชำระแล้ว — เงินสด'
                    : st === 'transfer' ? '✅ ชำระแล้ว — โอนเงิน'
                    : 'ยังไม่บันทึก';
  btnC.className = 'pay-btn' + (st === 'cash' ? ' active-cash' : '');
  btnT.className = 'pay-btn' + (st === 'transfer' ? ' active-transfer' : '');
}

// ===== SET PAY =====
async function setPay(type) {
  if (!currentStudent) return;

  // toggle ถ้ากดซ้ำ
  const prev = sessionPay[currentStudent.id];
  const newStatus = prev === type ? null : type;

  if (newStatus) sessionPay[currentStudent.id] = newStatus;
  else delete sessionPay[currentStudent.id];

  updateCardStatus();

  // แสดง sending
  const sendRow = document.getElementById('sendingRow');
  sendRow.style.display = 'flex';

  const payload = {
    id:     currentStudent.id,
    name:   currentStudent.name,
    gender: currentStudent.g === 'female' ? 'หญิง' : 'ชาย',
    status: newStatus || 'cancel'
  };

  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    sendRow.style.display = 'none';
    const label = type === 'cash' ? 'เงินสด' : 'โอนเงิน';
    const msg   = newStatus ? `✅ บันทึก "${currentStudent.name}" — ${label}` : `↩️ ยกเลิก "${currentStudent.name}"`;
    const color = newStatus === 'cash' ? '#4ade80' : newStatus === 'transfer' ? '#60a5fa' : '#f59e0b';
    showToast(msg, color);
  } catch(err) {
    sendRow.style.display = 'none';
    showToast('⚠️ ไม่มีสัญญาณ — ลองใหม่อีกครั้ง', '#f87171');
  }

  // ล้างช่องค้นหาหลัง 1.5 วิ เพื่อพร้อมรับคนต่อไป
  setTimeout(() => {
    input.value = '';
    document.getElementById('selectedCard').classList.remove('visible');
    currentStudent = null;
    input.focus();
  }, 1500);
}

// ===== TOAST =====
function showToast(msg, color) {
  const t   = document.getElementById('toast');
  const dot = document.getElementById('toastDot');
  const m   = document.getElementById('toastMsg');
  dot.style.background = color || '#4ade80';
  m.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
